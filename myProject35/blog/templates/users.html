
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
</head>
<body>

    {% load cache %}

    <h1>Users List</h1>

    {% cache 30 user_list_section %}
    <ul>
        {% for user in users %}
            <li>{{ user.name }} - {{ user.subscriber }} Subscribers</li>
        {% endfor %}
    </ul>
    {% endcache %}

</body>
</html>
